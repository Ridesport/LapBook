:root{
  --bg:#e9ecef;--surface:#ffffff;--raised:#f2f4f5;--line:#d2d8dd;--ink:#13171a;--muted:#59646e;
  --accent:#d9480f;--best:#15803d;--on-best:#ffffff;--good:#15803d;--bad:#dc2626;
  --l1:#0e8fb3;--l2:#d98f06;--l3:#d6336c;--l4:#2f9e44;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1214;--surface:#171b1f;--raised:#1f2429;--line:#2a3138;--ink:#e8ebee;--muted:#8d98a2;
    --accent:#ff7a3d;--best:#4ade80;--on-best:#05210f;--good:#4ade80;--bad:#f87171;
    --l1:#4cc9f0;--l2:#f2b134;--l3:#ef6fa0;--l4:#7bd88f;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1214;--surface:#171b1f;--raised:#1f2429;--line:#2a3138;--ink:#e8ebee;--muted:#8d98a2;
  --accent:#ff7a3d;--best:#4ade80;--on-best:#05210f;--good:#4ade80;--bad:#f87171;
  --l1:#4cc9f0;--l2:#f2b134;--l3:#ef6fa0;--l4:#7bd88f;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column;max-width:780px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
header .ttl{flex:1;min-width:0}
h1{margin:0;font:700 22px/1.1 'Barlow Condensed','Arial Narrow',sans-serif;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:focus-visible,.tab:focus-visible,.lap:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;overflow-y:auto;padding:0 12px 18px;-webkit-overflow-scrolling:touch}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:13px 4px 11px;cursor:pointer;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.hidden{display:none!important}
.clist{margin:4px 0 0;padding-left:20px}.clist li{margin:4px 0}
.chatlog{display:flex;flex-direction:column;gap:8px;margin:6px 0 8px}.chatmsg{border-radius:12px;padding:8px 12px;max-width:92%;white-space:pre-wrap}.chatmsg.me{align-self:flex-end;background:var(--accent);color:#fff}.chatmsg.coach{align-self:flex-start;background:var(--raised)}.chatmsg .cfig{background:#fff;color:#13171a;border-radius:8px;padding:6px;margin-top:6px;white-space:normal}
.seckey{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;margin-top:4px;font-size:13.5px}
.seckeyrow{display:flex;gap:6px;align-items:baseline}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modalbox{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.tpcur{margin-bottom:6px}
.tpres{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.tpitem{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer}
.tpitem.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dfast{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:4px}
.dft{font-size:22px;line-height:1.1}
.ddate{display:block;font-size:15.5px;color:var(--ink);opacity:.8;margin-top:1px}
.day.bestday .dft{color:var(--best)}
.tcard{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;cursor:pointer;border:1px solid var(--line)}
.tthumb{width:64px;height:64px;flex:none;background:var(--raised);border-radius:8px}
.tsearch{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;font-size:16px}
.hlogo{flex:none}
.day{margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:4px 8px 8px}
.day.hassel{border-color:var(--accent)}
.dayhead{display:flex;align-items:center;gap:8px}
.daytoggle{flex:1;min-width:0;display:flex;gap:8px;align-items:flex-start;border:0;background:none;text-align:left;padding:8px 4px;cursor:pointer}
.chev{width:18px;flex:none;font-size:16px;line-height:1.4;color:var(--muted)}
.dtitle{font:700 19px/1.2 'Barlow Condensed','Arial Narrow',sans-serif;display:block}
.tick{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:#fff;font-weight:700;cursor:pointer;margin:0 6px;align-self:center}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.part{border-color:var(--accent);color:var(--accent)}
.srec.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.srec.daybest .svenue{color:var(--best)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;flex:none}
.selbar{position:sticky;bottom:0;margin-top:12px;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px}
.selbar .btn:not(.primary){background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.selbar .btn[disabled]{opacity:.45}
.ghead{display:flex;gap:10px;align-items:center;padding:10px 2px 2px}
.gk{font:700 15px/1 'Barlow Condensed','Arial Narrow',sans-serif;background:var(--ink);color:var(--bg);border-radius:6px;padding:4px 7px}
.banner{display:block;width:100%;text-align:left;cursor:pointer;border-color:var(--accent)}
.opp{display:flex;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;cursor:pointer}
.opp:first-of-type{border-top:0}
.oname{font:700 22px/1 'Barlow Condensed','Arial Narrow',sans-serif;min-width:2.4ch;color:var(--accent)}
.otxt{flex:1;min-width:0}
.ctab td.win{color:var(--good);font-weight:700}
td.warn{color:var(--bad);font-weight:700}
.pitem{padding:10px 0;border-top:1px solid var(--line)}
.pbig{font:600 18px/1.25 'Barlow Condensed','Arial Narrow',sans-serif}
.chipst{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;color:#fff;background:var(--muted)}
.chipst.hit{background:var(--good)}.chipst.improved{background:var(--l2)}.chipst.missed{background:var(--bad)}
.bar{height:10px;background:var(--raised);border-radius:5px;overflow:hidden;margin:2px 0 6px}
.bar>div{height:100%;width:0}
.tab{font-size:14px;padding-left:2px;padding-right:2px}
.sess{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.srec{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;align-items:stretch;overflow:hidden}
.sopen{flex:1;min-width:0;border:0;background:none;text-align:left;padding:11px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.sopen:focus-visible,.sdel:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.stop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.svenue{font:700 19px/1.15 'Barlow Condensed','Arial Narrow',sans-serif}
.sbest{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sbt{font-size:22px;line-height:1.1}
.tb{font-size:11.5px;font-weight:600;color:var(--on-best);background:var(--best);border-radius:5px;padding:1px 6px}
.sdel{border:0;border-left:1px solid var(--line);background:none;color:var(--muted);padding:0 12px;cursor:pointer;font-size:13px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.tab{font-size:14px}
.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* board */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hero .big{font-size:46px;line-height:1}
.hero .lab{color:var(--muted);font-size:13px}
.hero .opt{font-size:30px;line-height:1.1;color:var(--best)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.laps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.lap{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:8px 10px 8px 10px;cursor:pointer;text-align:left;width:100%}
.lap.sel{border-left-color:var(--c)}
.lap.off{opacity:.55}
.lap .top{display:flex;align-items:baseline;gap:10px}
.lap .n{width:2ch;color:var(--muted);font-size:18px}
.lap .lt{font-size:24px;flex:1}
.lap .gap{font-size:16px;color:var(--muted)}
.lap .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px}
.lap.sel .tag.ref{color:var(--c);border-color:var(--c)}
.secs{display:flex;gap:4px;margin-top:6px}
.sec{flex:1;min-width:0;background:var(--raised);border-radius:5px;padding:3px 4px;text-align:center}
.sec .st{font-size:14px;line-height:1.1}
.sec .sd{font-size:11px;color:var(--muted);line-height:1.2}
.sec.best{background:var(--best);color:var(--on-best)}
.sec.best .sd{color:var(--on-best);opacity:.85}

/* graphs */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px}
.chip button{border:0;background:var(--raised);border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 8px;min-height:36px;max-width:100%}
.cv{display:block;width:100%;border-radius:10px;background:var(--surface);border:1px solid var(--line);touch-action:pan-y}
table.rd{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
#rd,#mrd{overflow-x:auto}
table.rd th,table.rd td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line)}
table.rd th:first-child,table.rd td:first-child{text-align:left;white-space:normal}
table.rd th{color:var(--muted);font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0 4px}
.legend{height:10px;border-radius:5px;margin-top:6px}

/* setup */
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;width:100%}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:calc(100% - 32px);font-size:14px;z-index:9}
h2{font:700 18px/1.2 'Barlow Condensed','Arial Narrow',sans-serif;margin:0 0 4px}
.lmap{width:100%;height:min(62vh,520px);border-radius:10px;border:1px solid var(--line);margin-top:10px;background:var(--raised)}
.sflab{background:rgba(0,0,0,.65);color:#fff;border:0;box-shadow:none;font:600 12px Barlow,system-ui,sans-serif;padding:1px 6px}
.sflab::before{display:none}

<script>
'use strict';
/* ============================================================
   Pure logic: parsing, laps, sectors, resampling, demo data
   ============================================================ */
const G = 1000; // samples per lap in the aligned (fraction-of-lap) grid
const lb = (a, v, lo = 0, hi = a.length) => { while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < v) lo = m + 1; else hi = m; } return lo; };
const median = a => { const b = [...a].sort((x, y) => x - y), n = b.length; return n ? (n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2) : 0; };
const sum = a => a.reduce((x, y) => x + y, 0);

function parseLine(l) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < l.length; i++) {
    const c = l[i];
    if (q) { if (c === '"') { if (l[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur); return out;
}

function parseCSV(text, fname) {
  const lines = text.replace(/\r/g, '').split('\n');
  const meta = {}; let hi = -1;
  for (let i = 0; i < Math.min(lines.length, 400); i++) {
    const r = parseLine(lines[i]); const k = (r[0] || '').trim().toLowerCase();
    if (k === 'time' && r.length > 3) { hi = i; break; }
    if (k && r.length >= 2) meta[k] = r.slice(1).map(s => s.trim()).filter(Boolean);
  }
  if (hi < 0) throw new Error('No data table found. Export the session from RaceStudio 3 as CSV and try again.');
  const names = parseLine(lines[hi]).map(s => s.trim());
  const u = parseLine(lines[hi + 1] || '');
  const isUnits = u.length > 2 && u[0].trim() !== '' && u.slice(0, 4).every(c => c.trim() === '' || !Number.isFinite(parseFloat(c)));
  const units = isUnits ? u.map(s => s.trim()) : names.map(() => '');
  const cols = names.map(() => []);
  for (let i = hi + 1 + (isUnits ? 1 : 0); i < lines.length; i++) {
    const ln = lines[i]; if (!ln) continue;
    const r = parseLine(ln); const t = parseFloat(r[0]);
    if (!Number.isFinite(t)) continue;
    for (let c = 0; c < names.length; c++) { const v = parseFloat(r[c]); cols[c].push(Number.isFinite(v) ? v : NaN); }
  }
  const n = cols[0].length;
  if (n < 50) throw new Error('This file has too few samples to analyse.');
  const s = { name: (fname || 'Session').replace(/\.[^.]+$/, ''), t: Float64Array.from(cols[0]), ch: {}, meta };
  const get = k => (meta[k] || [])[0] || '';
  s.venue = get('venue'); s.vehicle = get('vehicle'); s.driver = get('user') || get('racer'); s.date = [get('date'), get('time')].filter(Boolean).join(' ');
  for (let c = 1; c < names.length; c++) {
    if (!names[c]) continue;
    const d = Float64Array.from(cols[c]);
    if (/latitude|longitude/i.test(names[c])) for (let i = 0; i < n; i++) if (d[i] === 0) d[i] = NaN;
    let last = NaN; for (let i = 0; i < n; i++) { if (Number.isFinite(d[i])) last = d[i]; else d[i] = last; }
    let first = d.find(Number.isFinite); if (first === undefined) continue;
    for (let i = 0; i < n && !Number.isFinite(d[i]); i++) d[i] = first;
    s.ch[names[c]] = { unit: units[c] || '', data: d };
  }
  const bm = (meta['beacon markers'] || []).join(',').split(',').map(parseFloat).filter(Number.isFinite);
  s.beacons = bm;
  return finishSession(s);
}

function finishSession(s) {
  const n = s.t.length, names = Object.keys(s.ch);
  const find = re => names.find(k => re.test(k));
  const latK = find(/latitude/i) || find(/^lat$/i), lonK = find(/longitude/i) || find(/^lon(g)?$/i);
  const spK = find(/^gps speed$/i) || find(/speed/i);
  s.spK = spK || null;
  const f = spK ? ({ 'mph': 1.609344, 'm/s': 3.6 }[(s.ch[spK].unit || '').toLowerCase()] || 1) : 1;
  s.speedKmh = new Float64Array(n);
  if (spK) { const d = s.ch[spK].data; for (let i = 0; i < n; i++) s.speedKmh[i] = d[i] * f; }
  s.dist = new Float64Array(n);
  if (latK && lonK) {
    const la = s.ch[latK].data, lo = s.ch[lonK].data;
    let lat0 = 0; for (let i = 0; i < n; i++) lat0 += la[i]; lat0 /= n;
    const lon0 = lo[0], kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110574;
    s.X = new Float64Array(n); s.Y = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      s.X[i] = (lo[i] - lon0) * kx; s.Y[i] = (la[i] - lat0) * ky;
      if (i) s.dist[i] = s.dist[i - 1] + Math.hypot(s.X[i] - s.X[i - 1], s.Y[i] - s.Y[i - 1]);
    }
  } else {
    for (let i = 1; i < n; i++) s.dist[i] = s.dist[i - 1] + s.speedKmh[i] / 3.6 * (s.t[i] - s.t[i - 1]);
  }
  s.latK = latK || null; s.lonK = lonK || null;
  if (s.X) { let lt0 = 0; const la = s.ch[latK].data; for (let i = 0; i < n; i++) lt0 += la[i]; lt0 /= n; s.proj = { lat0: lt0, lon0: s.ch[lonK].data[0], kx: 111320 * Math.cos(lt0 * Math.PI / 180), ky: 110574 }; }
  s.hasGPS = !!s.X; s.duration = s.t[n - 1] - s.t[0];
  s.key = [s.name, s.date, Math.round(s.duration)].join('|');
  return s;
}

function detectBoundaries(s) {
  const { t, X, Y } = s, n = t.length;
  if (!X) return [t[0], t[n - 1]];
  const sorted = Array.from(s.speedKmh).sort((a, b) => a - b), p90 = sorted[Math.floor(n * .9)] || 50;
  let i0 = s.speedKmh.findIndex(v => v > .6 * p90); if (i0 < 0) i0 = 0;
  const sx = X[i0], sy = Y[i0], j5 = Math.min(i0 + 5, n - 1), hx = X[j5] - sx, hy = Y[j5] - sy, R = 40;
  const out = [t[0]]; let last = t[i0], i = i0 + 1;
  while (i < n) {
    const d = Math.hypot(X[i] - sx, Y[i] - sy);
    if (d < R && t[i] - last > 20) {
      let j = i, best = d, bj = i;
      while (j < n && Math.hypot(X[j] - sx, Y[j] - sy) < R) { const dj = Math.hypot(X[j] - sx, Y[j] - sy); if (dj < best) { best = dj; bj = j; } j++; }
      const k = Math.min(bj + 5, n - 1);
      if ((X[k] - X[bj]) * hx + (Y[k] - Y[bj]) * hy > 0) { out.push(t[bj]); last = t[bj]; }
      i = j;
    } else i++;
  }
  out.push(t[n - 1]); return out;
}

function retimeLaps(s, lat, lon) {
  const la = s.ch[s.latK].data, lo = s.ch[s.lonK].data, t = s.t, n = t.length, c = Math.cos(lat * Math.PI / 180);
  const dist = i => Math.hypot((la[i] - lat) * 110574, (lo[i] - lon) * 111320 * c), xs = []; let i = 0;
  while (i < n) {
    if (dist(i) < 30) { let bi = i, bd = dist(i); while (i < n && dist(i) < 30) { const d = dist(i); if (d < bd) { bd = d; bi = i; } i++; } if (!xs.length || t[bi] - xs[xs.length - 1] > 30) xs.push(t[bi]); }
    else i++;
  }
  const out = []; let prev = t[0];
  xs.forEach((x, k) => { out.push({ t0: prev, t1: x, kind: k === 0 ? 'out' : 'full' }); prev = x; });
  out.push({ t0: prev, t1: t[n - 1], kind: 'in' });
  return out;
}
function buildLaps(s) {
  const t = s.t, n = t.length; let b;
  if (s.lapList && s.lapList.length) b = [];
  else if (s.beacons && s.beacons.length) b = [t[0], ...s.beacons.filter(x => x > t[0] + 5 && x < t[n - 1] - 5).sort((a, c) => a - c), t[n - 1]];
  else b = detectBoundaries(s);
  const laps = [];
  if (s.lapList && s.lapList.length) {
    for (const L of s.lapList) {
      const i0 = Math.min(lb(t, L.t0), n - 1), i1 = Math.min(lb(t, L.t1), n - 1);
      if (i1 <= i0 + 5) continue;
      laps.push({ n: laps.length + 1, t0: L.t0, t1: L.t1, i0, i1, time: L.t1 - L.t0, dist: s.dist[i1] - s.dist[i0], cache: new Map(), secs: [], kind: L.kind });
    }
    const med = median(laps.filter(l => l.kind === 'full').map(l => l.time));
    laps.forEach(l => { l.valid = l.kind === 'full' && l.dist > 500 && l.time >= 15 && l.time >= .75 * med && l.time <= 1.25 * med; });
    return laps;
  }
  for (let k = 0; k < b.length - 1; k++) {
    const i0 = Math.min(lb(t, b[k]), n - 1), i1 = Math.min(lb(t, b[k + 1]), n - 1);
    if (i1 <= i0 + 5) continue;
    laps.push({ n: laps.length + 1, t0: b[k], t1: b[k + 1], i0, i1, time: b[k + 1] - b[k], dist: s.dist[i1] - s.dist[i0], cache: new Map(), secs: [] });
  }
  const med = median(laps.map(l => l.time));
  laps.forEach(l => { l.valid = l.dist > 500 && l.time >= 15 && l.time >= .75 * med && l.time <= 1.25 * med; });
  return laps;
}

function timeAtFrac(s, l, f) {
  if (f <= 0) return 0; if (f >= 1) return l.time;
  const target = s.dist[l.i0] + f * l.dist, j = lb(s.dist, target, l.i0, l.i1 + 1);
  if (j <= l.i0) return 0; if (j > l.i1) return l.time;
  const d0 = s.dist[j - 1], d1 = s.dist[j], u = d1 > d0 ? (target - d0) / (d1 - d0) : 0;
  return Math.max(0, s.t[j - 1] + (s.t[j] - s.t[j - 1]) * u - l.t0);
}

function computeSectors(s, laps, N) {
  for (const l of laps) { l.secs = []; let prev = 0; for (let k = 1; k <= N; k++) { const tt = timeAtFrac(s, l, k / N); l.secs.push(tt - prev); prev = tt; } }
  const valid = laps.filter(l => l.valid);
  const bestSec = Array.from({ length: N }, (_, k) => valid.length ? Math.min(...valid.map(l => l.secs[k])) : NaN);
  const best = valid.reduce((a, l) => (!a || l.time < a.time ? l : a), null);
  return { bestSec, best, optimal: sum(bestSec) };
}

/* Resample a channel onto G+1 points of equal fraction-of-lap */
function series(s, l, key) {
  if (l.s) s = l.s;
  let c = l.cache.get(key); if (c) return c;
  c = new Float32Array(G + 1);
  const k2 = key.slice(2), chn = s.ch[key.slice(2)];
  const arr = key === 'sys:t' ? s.t : key === 'sys:x' ? s.X : key === 'sys:y' ? s.Y : key === 'sys:spd' ? s.speedKmh
    : key.startsWith('a:') ? s.an[k2] : key.startsWith('b:') ? (s.ch[k2] ? (s.ch[k2].base || s.ch[k2].data) : null) : (chn ? chn.data : null);
  if (!arr) { c.fill(NaN); l.cache.set(key, c); return c; }
  const base = s.dist[l.i0];
  for (let k = 0; k <= G; k++) {
    const target = base + (k / G) * l.dist, j = lb(s.dist, target, l.i0, l.i1 + 1);
    let v;
    if (j <= l.i0) v = arr[l.i0]; else if (j > l.i1) v = arr[l.i1];
    else { const d0 = s.dist[j - 1], d1 = s.dist[j], u = d1 > d0 ? (target - d0) / (d1 - d0) : 0; v = arr[j - 1] + (arr[j] - arr[j - 1]) * u; }
    c[k] = v;
  }
  if (key === 'sys:t') { for (let k = 0; k <= G; k++) c[k] -= l.t0; c[0] = 0; c[G] = l.time; }
  l.cache.set(key, c); return c;
}
const chKey = name => 'c:' + name;

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Synthetic session so the app is usable before you load real data */
function makeDemo() {
  const rnd = mulberry(7), TAU = Math.PI * 2;
  const raw = []; const M = 3000;
  for (let i = 0; i < M; i++) { const p = TAU * i / M, r = 420 + 90 * Math.cos(2 * p + .6) + 60 * Math.sin(3 * p) + 35 * Math.cos(5 * p); raw.push([1.5 * r * Math.cos(p), .9 * r * Math.sin(p)]); }

/* Corner diagram: your line and the quickest line, numbered callouts, brake and throttle traces */
function cornerFigure(k, focus) {
  const c = S.corners[k], ref = S.best, valid = allLaps().filter(l => l.valid && getM(l)); if (!c || !ref) return '';
  const RD = refDist(), mb = getM(ref).corners[k];
  const pick = key => valid.reduce((a, l) => (!a || getM(l).corners[k][key] < getM(a).corners[k][key] ? l : a), null);
  const bestL = pick('time'), E = pick('entryT'), X = pick('exitT'), me = getM(E).corners[k], mx = getM(X).corners[k];
  const f0 = Math.max(0, Math.min(mb.liftF ?? mb.bpF ?? c.a, me.bpF ?? c.a) - .012), f1 = Math.min(1, Math.max(mb.ftF ?? c.b, mx.ftF ?? c.b) + .012);
  const rY = lapRaw(ref), rB = lapRaw(bestL), seg = (r, a, b) => { const o = []; for (let j = 0; j < r.n; j++) if (r.f[j] >= a && r.f[j] <= b) o.push([r.x[j], r.y[j], r.f[j]]); return o; };
  const pY = seg(rY, f0, f1), pB = seg(rB, f0, f1); if (pY.length < 3) return '';
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity; for (const [x, y] of [...pY, ...pB]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const W = 360, H = 240, pad = 26, sc = Math.min((W - 2 * pad) / (x1 - x0 || 1), (H - 2 * pad) / (y1 - y0 || 1)), ox = (W - sc * (x1 - x0)) / 2, oy = (H - sc * (y1 - y0)) / 2;
  const P = (x, y) => [+(ox + (x - x0) * sc).toFixed(1), +(H - (oy + (y - y0) * sc)).toFixed(1)];
  const at = (r, f) => { const loc = locate(r.f, r.n, f); return P(lerpAt(r.x, loc), lerpAt(r.y, loc)); };
  const path = pts => 'M' + pts.map(([x, y]) => P(x, y).join(',')).join('L');
  const brk = S.sess.an.cm.brk ? series(S.sess, ref, 'b:' + S.sess.an.cm.brk) : null, on = S.sess.an.brkOn || 1;
  const brakeRuns = []; if (brk) { let run = null; for (const p of pY) { const b = brk[Math.round(p[2] * G)] > on; if (b) { (run = run || []).push(p); } else if (run) { brakeRuns.push(run); run = null; } } if (run) brakeRuns.push(run); }
  const band = 10 * sc; // about a 10 m wide road for context
  const callouts = [], CO = (r, f, col, hollow, text) => { if (f == null) return; const [x, y] = at(r, f); callouts.push({ x, y, col, hollow, text }); };
  if (focus !== 'throttle') { CO(rY, mb.bpF, '#dc2626', false, 'You start braking: ' + fmtRel(relDist(c, mb.bpF, RD)) + ' the apex'); if (E !== ref && me.bpF != null) CO(lapRaw(E), me.bpF, '#dc2626', true, lapLabel(E) + ' (quickest entry) brakes ' + fmtRel(relDist(c, me.bpF, RD))); }
  CO(rY, mb.minF, '#111827', false, 'Your apex: ' + fSpeed(mb.vMin) + (bestL !== ref ? ', ' + lapLabel(bestL) + ' ' + fSpeed(getM(bestL).corners[k].vMin) : ''));
  if (focus !== 'brake') { CO(rY, mb.onF, '#16a34a', false, 'You get back on throttle: ' + fmtRel(relDist(c, mb.onF, RD))); if (X !== ref && mx.onF != null) CO(lapRaw(X), mx.onF, '#16a34a', true, lapLabel(X) + ' (quickest exit) on throttle ' + fmtRel(relDist(c, mx.onF, RD))); }
  callouts.forEach((o, i) => { for (let tries = 0; tries < 6 && callouts.slice(0, i).some(q => Math.hypot(q.x - o.x, q.y - o.y) < 19); tries++) { o.x += o.x < W - 30 ? 19 : -19; } });
  const dots = callouts.map((o, i) => `<circle cx="${o.x}" cy="${o.y}" r="9" fill="${o.hollow ? '#fff' : o.col}" stroke="${o.col}" stroke-width="2.5"/><text x="${o.x}" y="${o.y + 4}" font-size="11" font-weight="700" text-anchor="middle" fill="${o.hollow ? o.col : '#fff'}">${i + 1}</text>`).join('');
  const legend = callouts.map((o, i) => `<div style="display:flex;gap:6px;align-items:baseline;margin:2px 0"><span style="display:inline-block;min-width:18px;height:18px;border-radius:50%;border:2px solid ${o.col};background:${o.hollow ? '#fff' : o.col};color:${o.hollow ? o.col : '#fff'};font:700 11px/18px sans-serif;text-align:center">${i + 1}</span><span>${esc(o.text)}</span></div>`).join('');
  const map = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;background:#eef2f0;border-radius:10px">
<path d="${path(pY)}" fill="none" stroke="#c9d1cc" stroke-width="${Math.max(8, band).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round"/>
${bestL !== ref ? `<path d="${path(pB)}" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 5"/>` : ''}
<path d="${path(pY)}" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round"/>
${brakeRuns.map(r => `<path d="${path(r)}" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round" opacity=".55"/>`).join('')}
${dots}</svg>`;
  // traces: speed, with brake and throttle bands, for your lap against the quickest lap here
  const i0 = Math.round(f0 * G), i1 = Math.round(f1 * G), n = i1 - i0, vY = series(S.sess, ref, 'sys:spd'), vB = series(S.sess, bestL, 'sys:spd');
  const thrK = S.sess.an.cm.thr, thY = thrK ? series(S.sess, ref, 'b:' + thrK) : null, full = S.sess.an.thrFull || 100;
  let lo = Infinity, hi = -Infinity; for (let i = i0; i <= i1; i++) { lo = Math.min(lo, vY[i], vB[i]); hi = Math.max(hi, vY[i], vB[i]); }
  const TW = 360, TH = 150, tx = i => (10 + (i - i0) / (n || 1) * (TW - 20)).toFixed(1), ty = v => (98 - (v - lo) / (hi - lo || 1) * 84).toFixed(1);
  const line = (arr, col, dash) => `<path d="M${Array.from({ length: n + 1 }, (_, j) => tx(i0 + j) + ',' + ty(arr[i0 + j])).join('L')}" fill="none" stroke="${col}" stroke-width="2.2"${dash ? ' stroke-dasharray="6 4"' : ''}/>`;
  const bar = (arr, lim, y, col) => arr ? Array.from({ length: n + 1 }, (_, j) => { const v = Math.max(0, Math.min(1, arr[i0 + j] / lim)); return v > .02 ? `<rect x="${tx(i0 + j)}" y="${(y + 14 * (1 - v)).toFixed(1)}" width="${((TW - 20) / (n || 1) + .5).toFixed(2)}" height="${(14 * v).toFixed(1)}" fill="${col}"/>` : ''; }).join('') : '';
  const pk = getM(ref).corners[k].peakBrk || 1;
  const trace = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${TW} ${TH}" width="100%" style="max-width:${TW}px;background:#f6f7f8;border-radius:10px;margin-top:6px">
${bestL !== ref ? line(vB, '#6b7280', true) : ''}${line(vY, '#2563eb')}<text x="12" y="12" font-size="10" fill="#444">Speed ${fSpeed(lo, 0)} to ${fSpeed(hi, 0)}</text>
<text x="12" y="113" font-size="9.5" fill="#dc2626">Brake</text>${bar(brk, pk, 102, '#dc2626')}<text x="12" y="134" font-size="9.5" fill="#16a34a">Throttle</text>${bar(thY, full, 122, '#16a34a')}
</svg>`;
  const key = `<div style="font-size:12.5px;margin-top:6px">${legend}<div style="color:#59646e;margin-top:4px">Blue: your ${esc(lapLabel(ref))}.${bestL !== ref ? ' Dashed: ' + esc(lapLabel(bestL)) + ', quickest through ' + esc(c.name) + '.' : ' Your lap was also the quickest through ' + esc(c.name) + '.'} Red on the line: where you were on the brakes. Hollow numbers come from the laps with the quickest entry and exit.</div></div>`;
  return `<div class="cfig"><div style="font-weight:700;margin:4px 0">${esc(c.name)}${focus ? ': ' + esc(focus === 'brake' ? 'braking' : focus === 'throttle' ? 'throttle' : 'line') : ''}</div>${map}${key}${trace}</div>`;
}

/* ---------- Reports: stored per track, one version per analysis ---------- */
const groupKey = () => (S.openIds && S.openIds.size ? [...S.openIds].sort().join('+') : S.sess.key);
async function saveReport(r) { return DB.run(['reports'], 'readwrite', o => o.reports.add(r)); }
async function updateReport(r) { return DB.run(['reports'], 'readwrite', o => o.reports.put(r)); }
async function trackReports(track) { const all = await DB.run(['reports'], 'readonly', o => o.reports.getAll()); return all.filter(r => r.track === track).sort((a, b) => b.created - a.created); }
async function loadTrackHistory() {
  try { const list = (await DB.list()).filter(m => trackOf(m) === S.sess.venue && m.best).sort((a, b) => (a.when || a.added) - (b.when || b.added));
    S.trackHistory = list.map(m => ({ date: Number.isFinite(m.when) ? new Date(m.when).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '', session: mv(m, 'name'), best: +m.best.toFixed(3), timed_laps: m.laps })); } catch (e) { S.trackHistory = []; }
}
function figuresFor(ai) {
  const figs = {}, ts = (ai.turns || []).filter(t => t.figure).slice(0, 4);
  for (const t of ts) { const k = S.corners.findIndex(c => c.name === t.corner); if (k >= 0) { try { figs[t.corner] = cornerFigure(k, t.figure_focus); } catch (e) { } } }

}
async function runAnalysis(btn, statusBox) {
  await loadTrackHistory();

  const say = (...kids) => { if (statusBox) statusBox.replaceChildren(...kids); };
  const sample = window.claude && claude.use ? await claude.use('sample').catch(() => null) : null;
  if (sample) {
    const perms = await claude.use('permissions').catch(() => null);
    let st = 'granted'; if (perms) { try { st = await perms.state('sample'); if (st === 'prompt') st = (await perms.request(['sample'])).sample || st; } catch (e) { } }
    if (st === 'denied') {
      say(h('div', { class: 'panel' }, h('b', {}, 'AI analysis is switched off for this page.'), h('p', { class: 'small muted', style: 'margin:4px 0 8px' }, 'Turn it on in the page’s permissions, then tap Analyse again. Until then the app writes the analysis with its own rules.'),
        perms ? h('button', { class: 'btn', onclick: () => perms.manage().catch(() => toast('Open the artifact’s Permissions menu at the top of the page.')) }, 'Open permissions') : null));
    } else {
      const ctl = new AbortController(); let useRules = false, started = false; const t0 = Date.now();
      const words = h('span', { class: 'num' }, ''), msg = h('b', {}, 'Waiting for Claude…'), sub = h('div', { class: 'small muted' }, 'Claude is reading every corner’s data. The first words usually come within 20–60 seconds.');
      const tick = setInterval(() => { if (!started) sub.textContent = 'Claude is reading every corner’s data (' + Math.round((Date.now() - t0) / 1000) + ' s). The first words usually come within 20–60 seconds.'; }, 1000);
      say(h('div', { class: 'panel' }, msg, ' ', words, sub, h('div', { class: 'row', style: 'flex-wrap:wrap' },
        h('button', { class: 'btn', onclick: () => ctl.abort() }, 'Stop'), h('button', { class: 'btn', onclick: () => { useRules = true; ctl.abort(); } }, 'Use the app’s analysis instead'))));
      btn.textContent = 'Analysing…'; btn.disabled = true;
      try {
        ai = await sample.json(COACH_PROMPT + '\n\nDATA:\n' + JSON.stringify(pkg), { modelTier: 'default', cache: false, signal: ctl.signal,
          onText: ({ text }) => { if (!started) { started = true; msg.textContent = 'Claude is writing…'; sub.textContent = 'A full plan takes a minute or so to write.'; } words.textContent = (text.match(/\S+/g) || []).length + ' words'; } });
      } catch (e) {
        if (e.code === 'cancelled' && !useRules) { clearInterval(tick); say(); btn.disabled = false; btn.textContent = 'Analyse this session'; return null; }
        if (!useRules) toast(e.code === 'not_granted' ? 'AI analysis wasn’t allowed, so the app wrote this itself.' : e.code === 'rate_limited' ? 'AI analysis is busy right now, so the app wrote this itself.' : e.code === 'invalid_json' ? 'The AI answer came back incomplete, so the app wrote this itself.' : 'AI analysis didn’t finish, so the app wrote this itself.');
      }

  const rep = { v: 2, track: S.sess.venue, key: groupKey(), created: Date.now(), by, label: (S.group.length > 1 ? S.group.length + ' sessions' : S.sess.name) + ', ' + (S.sess.date || ''), best: S.best.time, optimal: S.optimal, ai, pkg, figs: figuresFor(ai), extraFigs: [], chat: [], corners: S.corners.map(c => c.name) };
  try { rep.id = await saveReport(rep); } catch (e) { toast('The analysis couldn’t be saved on this device.'); }
  S.report = rep; return rep;
}

  async shape(id) {

    if (!window.LAPBOOK_AIM) return null;

      t && t.len ? h('tr', {}, h('td', {}, 'Your lap length'), h('td', { class: 'num' }, fmtTrackLen(t.len))) : null,
      t ? h('tr', {}, h('td', {}, 'Sessions'), h('td', { class: 'num' }, t.ms.length + ' over ' + t.days + (t.days === 1 ? ' day' : ' days'))) : null,
      t && t.best ? h('tr', {}, h('td', {}, 'Best lap'), h('td', { class: 'num' }, fmtT(t.best.best) + ', ' + (mv(t.best, 'name') || ''))) : null,
      t ? h('tr', {}, h('td', {}, 'Logged as'), h('td', {}, t.rs3.join(', '))) : null,
      sf ? h('tr', {}, h('td', {}, 'Start/finish'), h('td', { class: 'num' }, sf[0].toFixed(6) + ', ' + sf[1].toFixed(6))) : null))));
  requestAnimationFrame(() => drawOutline(cv, pts, { sf, width: 3.5, dot: 6, pad: 14 }));
  // layout check against AiM, with the option to re-file and re-time
  if (t && a && AIM.idx) {
    const sib = [a, ...AIM.siblings(a)].filter(x => x.len);
    const mismatch = t.len && a.len && Math.abs(t.len - a.len) / a.len > .06;
    let best = null;
    if (t.path) for (const s of sib) { if (t.len && Math.abs(t.len - s.len) / s.len > .06) continue; const sp = await AIM.shape(s.id); const d = sp ? pathMatch(t.path, sp) : Infinity; if (d < 40 && (!best || d < best.d)) best = { s, d }; }
    const box = h('div', { class: 'panel' }, h('h2', {}, 'Layout and start/finish'));
    if (mismatch) box.append(h('p', { style: 'margin:0 0 8px' }, 'Your laps are ' + fmtTrackLen(t.len) + ', but AiM’s ' + a.short + ' layout is ' + fmtTrackLen(a.len) + '. The logger probably used ' + a.short + '’s start/finish line while you drove a different layout' + (best && best.s.id !== a.id ? ', most likely ' + best.s.short + ' (' + fmtTrackLen(best.s.len) + ')' : '') + '.'));
    else box.append(h('p', { class: 'small muted', style: 'margin:0 0 8px' }, 'Your laps match AiM’s ' + a.short + ' layout. You can switch to another start/finish line at this venue; lap times are re-timed from GPS.'));
    const opts = [...new Map(sib.map(s => [s.id, s])).values()].sort((x, y) => (best && x.id === best.s.id ? -1 : 0) - (best && y.id === best.s.id ? -1 : 0));
    const sel = h('select', { 'aria-label': 'AiM layout' }, opts.map(s => h('option', { value: s.id, selected: best ? s.id === best.s.id : s.id === a.id }, s.short + ', ' + fmtTrackLen(s.len) + (best && s.id === best.s.id ? ' (matches your laps)' : ''))));
    const nameIn = h('input', { type: 'text', value: t.name, 'aria-label': 'Track name for these sessions', class: 'tsearch', style: 'margin-top:8px' });
    box.append(sel, h('label', { class: 'small muted', style: 'display:block;margin-top:8px' }, 'Name to file them under'), nameIn,
      h('button', { class: 'btn primary', style: 'margin-top:10px', onclick: async () => {
        const s = AIM.idx.find(x => x.id === sel.value); if (!s) return;
        if (!await askConfirm('Re-time all ' + t.ms.length + ' sessions to ' + s.short + '’s start/finish line and file them under “' + (nameIn.value.trim() || s.short) + '”?')) return;
        await refileTrack(t, nameIn.value.trim() || s.short, s.sf); HS.track = { kind: 'mine', name: nameIn.value.trim() || s.short }; renderHome();
      } }, 'Use this start/finish line'),
      h('p', { class: 'small muted', style: 'margin:8px 0 0' }, 'Re-timed laps usually land within a few hundredths of the logger’s own timing.'));
    v.append(box);
  }
  if (t) {
    const nameIn = h('input', { type: 'text', value: t.name, class: 'tsearch', 'aria-label': 'Track name' });
    const notes = h('textarea', { rows: '3', class: 'tsearch', 'aria-label': 'Track notes' }); notes.value = lsGet('lapbook:tracknote:' + t.name, '');
    notes.addEventListener('input', () => lsSet('lapbook:tracknote:' + t.name, notes.value));
    v.append(h('div', { class: 'panel' }, h('h2', {}, 'Name and notes'), nameIn,
      h('button', { class: 'btn', style: 'margin-top:8px', onclick: async () => { const nn = nameIn.value.trim(); if (!nn || nn === t.name) return; for (const m of t.ms) { m.edit = { ...(m.edit || {}), venue: nn }; try { await DB.putMeta(m); } catch (e) { } } lsSet('lapbook:tracknote:' + nn, lsGet('lapbook:tracknote:' + t.name, '')); for (const kf of [cornerKey, sectorKey]) { const val = lsGet(kf(t.name), null); if (val) lsSet(kf(nn), val); } HS.track = { kind: 'mine', name: nn }; toast('Renamed to ' + nn + '.'); renderHome(); } }, 'Rename track'),
      h('label', { class: 'small muted', style: 'display:block;margin-top:10px' }, 'Notes: gearing, reference points, track conditions'), notes));
    const sorted = [...t.ms].sort((x, y) => (y.when || y.added) - (x.when || x.added));
    v.append(h('div', { class: 'panel' }, h('div', { class: 'row', style: 'margin:0' }, h('h2', { style: 'margin:0' }, 'Sessions'), h('button', { class: 'btn', onclick: () => openGroup(t.ms.map(m => m.id)) }, 'View all together')),
      h('ul', { class: 'sess', style: 'margin-top:8px' }, sorted.map(m => h('li', {}, h('button', { class: 'lap', onclick: () => openStored(m.id) },
        h('div', { class: 'top' }, h('span', { style: 'flex:1;font-weight:600' }, (t.best === m ? '★ ' : '') + (mv(m, 'name') || 'Session')), h('span', { class: 'num' }, m.best ? fmtT(m.best) : '–')),
        h('div', { class: 'small muted' }, Number.isFinite(m.when) ? new Date(m.when).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '')))))));
  }
  v.append(h('div', { class: 'panel' }, h('h2', {}, 'Lap simulator'), h('p', { class: 'small muted', style: 'margin:0 0 8px' }, 'Predict a lap here using the car limits from the session you last opened.'),
    h('button', { class: 'btn primary', onclick: async () => {
      if (!S.sess) { toast('Open a session first. The simulator uses that session’s car limits.'); return; }
      S.simSrc = { name: title, latlon: pts, real: t && t.best ? t.best.best : null }; S.tab = 'sim'; enterSession(); $('#sname').textContent = S.sess.name; showTab('sim');
    } }, 'Simulate a lap here')));
}

/* ---------- Shell ---------- */
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
window.addEventListener('resize', () => { if (S.tab === 'graphs') drawGraph(); if (S.tab === 'map' && !S.lmap) drawMap(true); if (S.tab === 'gg') drawGG(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) stopPlay(); });
$('#btnOpen').addEventListener('click', () => $('#file').click());
$('#btnTheme').addEventListener('click', () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; showTab(S.tab);
});
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    toast('Reading ' + f.name + '…');
    const { saved } = await importFile(f.name, new Uint8Array(await f.arrayBuffer()));
    toast(saved ? 'Imported ' + f.name + '. It’s saved in your sessions.' : 'Opened ' + f.name + '. It couldn’t be saved on this device.');
  } catch (err) { toast(err.message || 'This file couldn’t be read.'); }
});
$('#btnBack').addEventListener('click', () => showHome());
(async () => {
  const b64 = t => { const bin = atob(t.trim()), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
  const seeds = [], emb = document.getElementById('embedded');
  if (emb) seeds.push({ name: emb.dataset.name || 'session.xrk', get: async () => b64(emb.textContent) });
  const bundles = {};
  for (const sd of (window.LAPBOOK_SEEDS || [])) seeds.push({ name: sd.name, edit: sd.edit, get: async () => {
    const [u, key] = sd.url.split('#');
    if (key) { bundles[u] = bundles[u] || fetch(u).then(r => { if (!r.ok) throw new Error('fetch'); return r.json(); }); const j = await bundles[u]; if (!j[key]) throw new Error('missing'); return b64(j[key]); }
    const r = await fetch(sd.url); if (!r.ok) throw new Error('fetch'); return b64(await r.text()); } });
  let files = [], dbOk = true; try { files = (await DB.list()).map(m => m.file); } catch (e) { dbOk = false; }
  const seen = n => { try { return localStorage.getItem('lapbook:seeded:' + n) === '1'; } catch (e) { return false; } };
  const todo = seeds.filter(sd => !seen(sd.name) && !files.includes(sd.name));
  if (!dbOk && todo.length) { try { await importFile(todo[0].name, await todo[0].get()); } catch (e) { toast('The included session couldn’t be read.'); } return; }
  await showHome();
  let added = 0;
  for (let i = 0; i < todo.length; i++) {
    const sd = todo[i];
    toast('Adding your sessions: ' + (i + 1) + ' of ' + todo.length + '…');
    try { const { saved } = await importFile(sd.name, await sd.get(), { open: false, edit: sd.edit || null }); if (saved) { added++; try { localStorage.setItem('lapbook:seeded:' + sd.name, '1'); if (sd.edit) localStorage.setItem('lapbook:seededit:' + sd.name, JSON.stringify(sd.edit)); } catch (e) { } } } catch (e) { }
    if (S.screen === 'home') await renderHome();
  }
  if (added) { try { const all = await DB.list(); const keys = all.map(dayKey).sort(); if (keys.length) { HS.open.add(keys[keys.length - 1]); HS.touched = true; saveHS(); } } catch (e) { } if (S.screen === 'home') await renderHome(); }
  try {
    for (const sd of seeds.filter(x => x.edit)) {
      let done = null; try { done = localStorage.getItem('lapbook:seededit:' + sd.name); } catch (e) { }
      if (done === JSON.stringify(sd.edit)) continue;
      const m = (await DB.list()).find(x => x.file === sd.name); if (!m) continue;
      toast('Updating track details…');
      m.edit = { ...(m.edit || {}), ...sd.edit };
      try {
        const rec = await DB.get(m.id), s = applyEdits(await sessionFromBytes(await unpackBytes(rec), rec.name), m), laps = buildLaps(s);
        const b = laps.filter(l => l.valid).reduce((a, l) => (!a || l.time < a.time ? l : a), null);
        m.len = lapLen(laps); m.best = b ? b.time : null; m.bestLap = b ? b.n : null; m.laps = laps.filter(l => l.valid).length; delete m.cs;
        await DB.putMeta(m); try { localStorage.setItem('lapbook:seededit:' + sd.name, JSON.stringify(sd.edit)); } catch (e) { }
      } catch (e) { }
    }
    if (S.screen === 'home') await renderHome();
  } catch (e) { }
  try {
    const all = await DB.list(), need = all.filter(m => m.len === undefined || m.path === undefined || (!(m.edit && m.edit.name) && /_\d+\.[^.]+$/.test(m.file || '') && !/\d$/.test(m.name || '')));
    for (let i = 0; i < need.length; i++) {
      const m = need[i]; toast('Building your track directory: ' + (i + 1) + ' of ' + need.length + '…');
      try { const rec = await DB.get(m.id); const s = await sessionFromBytes(await unpackBytes(rec), rec.name); const nm = s.name; m.trk = s.trkName || null; m.sf = s.sf || null; applyEdits(s, m); const laps = buildLaps(s); m.len = lapLen(laps); if (!(m.edit && m.edit.name) && !/\d$/.test(m.name || '')) m.name = nm; m.path = bestPath(s, laps); const b = laps.filter(l => l.valid).reduce((a, l) => (!a || l.time < a.time ? l : a), null); m.best = b ? b.time : null; m.bestLap = b ? b.n : null; m.laps = laps.filter(l => l.valid).length; delete m.cs; await DB.putMeta(m); } catch (e) { }
    }
    if (need.length) { if (S.screen === 'home') await renderHome(); if (!todo.length) toast('Sessions updated.'); }
  } catch (e) { }
  if (todo.length) toast(added === todo.length ? 'Added ' + added + ' session' + (added === 1 ? '' : 's') + '.' : 'Added ' + added + ' of ' + todo.length + ' sessions. Some couldn’t be loaded.');
})();
</script>
</body>
